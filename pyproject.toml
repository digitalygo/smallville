[project]
name = "smallville"
version = "0.2.0"
description = "Generative Agents: Interactive Simulacra of Human Behavior"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.8",
  "dj-database-url>=2.0",
  "Django>=5.2,<6.0",
  "gensim>=3.8",
  "gunicorn>=20.1",
  "matplotlib>=3.3",
  "nltk>=3.6",
  "numpy>=1.19",
  "openai>=1.0.0",
  "pandas>=1.1",
  "Pillow>=8.4",
  "psycopg2-binary>=2.9",
  "python-dateutil>=2.8",
  "python-dotenv>=1.0",
  "requests>=2.26",
  "scikit-learn>=1.3",
  "scipy>=1.5",
  "selenium>=4.8",
  "smart-open>=5.2",
  "tqdm>=4.62",
  "trio>=0.22",
  "trio-websocket>=0.9",
  "whitenoise>=6.0",
]

[tool.uv]
add-bounds = "major"
