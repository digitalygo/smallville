{% load static %}

{% csrf_token %}
<div id="step" style="display:none">{{step}}</div>
<div id="sim_code" style="display:none">{{sim_code}}</div>
<div id="persona_name_list" style="display:none">{{persona_name_str}}</div>
{{ persona_init_pos|json_script:"persona-init-pos" }}
{{ mode|json_script:"simulator-mode" }}
{{ initial_phase|json_script:"initial-phase" }}
{{ simulator_target_fps|json_script:"simulator-target-fps" }}

<script type="text/javascript">
	function getCookie(name) {
		let cookieValue = null;
		if (document.cookie && document.cookie !== '') {
			const cookies = document.cookie.split(';');
			for (let i = 0; i < cookies.length; i++) {
				const cookie = cookies[i].trim();
				if (cookie.substring(0, name.length + 1) === (name + '=')) {
					cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
					break;
				}
			}
		}
		return cookieValue;
	}
	const csrftoken = getCookie('csrftoken');

	/*
	  Main resources: 
	  https://www.youtube.com/watch?v=cKIG1lKwLeo&t=401s&ab_channel=HongLy
	  For the ground zero code, see the exported files from here: 
	  https://codepen.io/mikewesthad/pen/BVeoYP?editors=1111 

	  Also worth taking a look: 
	  https://www.youtube.com/watch?v=fdXcD9X4NrQ&ab_channel=MorganPage
	  and 
	  https://www.youtube.com/watch?v=MR2CvWxOEsw&ab_channel=MattWilber
	 */


	// ###########################################################################
	// PREAMBLE
	// ###########################################################################

	// <step> -- one full loop around all three phases determined by <phase> is 
	// a step. We use this to link the steps in the backend. 
	const terminalStep = Number.MAX_SAFE_INTEGER;
	const lastExecutableStep = terminalStep - 1;
	const initialStepText = document.getElementById('step').textContent;
	const parsedInitialStep = Number(initialStepText);
	const initialStepIsValid = initialStepText.trim() !== "" && Number.isSafeInteger(parsedInitialStep) && parsedInitialStep >= 0;
	let step = initialStepIsValid ? parsedInitialStep : 0;
	let sim_code = document.getElementById('sim_code').textContent;
	// let persona_names = document.getElementById('persona_name_list').textContent.split(",");

	let persona_init_pos = JSON.parse(document.getElementById('persona-init-pos').textContent);
	function getJsonScriptValue(id, fallback) {
		let element = document.getElementById(id);
		if (!element) return fallback;
		try {
			return JSON.parse(element.textContent);
		} catch {
			return fallback;
		}
	}
	const simulatorMode = getJsonScriptValue("simulator-mode", "");
	const initialPhase = getJsonScriptValue("initial-phase", "");
	const simulatorTargetFps = getJsonScriptValue("simulator-target-fps", 30);
	let persona_names = {};
	for (let i = 0, l = persona_init_pos.length; i < l; i++) {
		let x = persona_init_pos[i];
		persona_names[x[0]] = [parseInt(x[1]), parseInt(x[2])];
	}


	// Phaser 3.0 global settings. 
	// Configuration meant to be passed to the main Phaser game instance. 
	const config = {
	  type: Phaser.AUTO,
	  width: 1200,
	  height: 700,
	  scale: { mode: Phaser.Scale ? Phaser.Scale.FIT : 0, autoCenter: Phaser.Scale ? Phaser.Scale.CENTER_BOTH : 0 },
	  parent: "game-container",
	  pixelArt: true,
	  fps: { target: simulatorTargetFps },
	  scene: {
	    preload: preload,
	    create: create,
	    update: update } };


	// Creating the game instance and setting up the main Phaser variables that  
	// will be used in it. 
	const game = new Phaser.Game(config);
	let cursors;

	// Persona related variables. This should have the name of the persona as its 
	// keys, and the instances of the Persona class as the values.
	var spawn_tile_loc = {};
	// for (var i = 0; i < persona_names.length; i++) { 
	// 	spawn_tile_loc[persona_names[i]] = [0, 0]
	// }

	for (var key in persona_names){
		spawn_tile_loc[key] = persona_names[key] ;
	}

	var personas = {};
	var pronunciatios = {};

	let curr_maze = "the_ville";

	// <tile_width> is the width of one individual tile (tiles are square)
	let tile_width = 32;
	const movementDuration = 650;
	let motionElapsed = 0;
	let motionStarted = false;
	let movement_start = {};
	let logicalPositions = Object.fromEntries(Object.entries(persona_names).map(([name, tile]) => [name, [...tile]]));
	let followedPersona = null;
	let mapScene;
	let mapBounds;
	let paused = false;
	let waitingSince = Date.now();
	let statusMessage = "Loading map";

	// <phase> -- there are three phases: "process," "update," and "execute."
	let phase = !initialStepIsValid || step === terminalStep ? "complete" : simulatorMode === "simulate" && (initialPhase === "process" || initialPhase === "update") ? initialPhase : "update";
	const processEnvironmentUrl = "{% url 'process_environment' %}";
	const updateEnvironmentUrl = "{% url 'update_environment' %}";
	const replayMovementUrl = "{% url 'replay_movement' %}";
	const movementUpdateUrl = simulatorMode === "replay" ? replayMovementUrl : updateEnvironmentUrl;
	const retryBaseDelay = 250;
	const retryMaxDelay = 5000;
	const retryAttemptLimit = 5;
	let environmentPostInFlight = false;
	let environmentRetryAt = 0;
	let environmentRetryAttempts = 0;
	let movementPollInFlight = false;
	let movementPollRetryAt = 0;
	let movementPollRetryAttempts = 0;
	let resyncInProgress = false;
	let replayComplete = phase === "complete";

	// Variables for storing movements that are sent from the backend server.
	let execute_movement;

	let movement_target = {};

	function setText(id, text) {
		let el = document.getElementById(id);
		if (el) el.textContent = text;
	}

	function setStatus(message) {
		if (paused && !message.startsWith("Paused")) message = "Paused · " + message;
		statusMessage = message;
		setText("simulation-status", message);
		setText("step-content", String(step));
	}

	let statusPollAt = 0;
	let statusPollInFlight = false;
	async function pollRuntimeStatus() {
		statusPollInFlight = true;
		try {
			const response = await fetch("{% url 'runtime_status' %}?sim_code=" + encodeURIComponent(sim_code), {credentials: "same-origin", cache: "no-store", signal: AbortSignal.timeout(30000)});
			if (!response.ok) {
				setText("provider-progress", "Backend status unavailable · checking again shortly");
				return;
			}
			const status = await response.json();
			const activity = status.provider_activity || {};
			setText("provider-progress", "Backend connected · " + (activity.provider ? activity.provider + " " + (activity.operation || "") + " · " + activity.state + " · " + (activity.requests || 0) + " total attempts across providers" : "waiting for environment"));
		} catch {
			setText("provider-progress", "Backend status connection interrupted · retrying");
		} finally {
			statusPollAt = Date.now() + 5000;
			statusPollInFlight = false;
		}
	}

	function focusPersona(name) {
		if (!mapScene || !personas[name]) return;
		followedPersona = name;
		mapScene.cameras.main.useBounds = true;
		mapScene.cameras.main.setZoom(1.6);
		mapScene.cameras.main.startFollow(personas[name], true, 1, 1);
		setText("camera-status", "Following " + name);
		updateFollowButtons();
	}

	function updateFollowButtons() {
		for (const resident of Object.keys(personas)) {
			const button = document.getElementById("focus__" + resident.replace(/ /g, "_"));
			if (button) button.setAttribute("aria-pressed", String(resident === followedPersona));
		}
	}

	function fitMap() {
		if (!mapScene) return;
		followedPersona = null;
		updateFollowButtons();
		const camera = mapScene.cameras.main;
		camera.stopFollow();
		camera.setBackgroundColor("#d7e5be");
		camera.useBounds = false;
		camera.setZoom(Math.min(camera.width / mapBounds.width, camera.height / mapBounds.height));
		camera.centerOn(mapBounds.width / 2, mapBounds.height / 2);
		setText("camera-status", "Whole town");
	}

	function zoomMap(factor) {
		if (!mapScene) return;
		const camera = mapScene.cameras.main;
		camera.setZoom(Math.max(0.2, Math.min(3, camera.zoom * factor)));
		camera.useBounds = camera.displayWidth <= mapBounds.width && camera.displayHeight <= mapBounds.height;
	}

	function formatDestination(address) {
		const waiting = /^<waiting>\s+(\d+)\s+(\d+)$/.exec(address);
		if (waiting) return "Near tile " + waiting[1] + ", " + waiting[2];
		if (address.includes("<persona>")) return "With " + address.split("<persona>").pop().trim();
		return address.split(":").map(part => part.trim()).filter(part => part && !/^the[_ ]ville$/i.test(part)).map(part => part.replace("<random>", "Exploring")).join(" · ") || "No destination reported";
	}

	function renderChat(elementId, chatRaw) {
		let el = document.getElementById(elementId);
		if (!el) return;
		el.innerHTML = "";
		if (chatRaw == null || chatRaw.length === 0) {
			let em = document.createElement("em");
			em.textContent = "None at the moment";
			el.appendChild(em);
			return;
		}
		for (let j = 0; j < chatRaw.length; j++) {
			let speaker = chatRaw[j][0];
			let text = chatRaw[j][1];
			el.appendChild(document.createTextNode(speaker + ": " + text));
			el.appendChild(document.createElement("br"));
		}
	}

	function retryDelay(attempts) {
		return Math.min(retryBaseDelay * (2 ** attempts), retryMaxDelay);
	}

	function sessionUnavailable(response) {
		if (response.status !== 401 && response.status !== 403 && !response.redirected) return false;
		stopSimulator();
		setStatus("Session unavailable · reload and sign in again");
		return true;
	}

	function isExecutableStep(value) {
		return Number.isSafeInteger(value) && value >= 0 && value < terminalStep;
	}

	function stopSimulator() {
		phase = "complete";
		replayComplete = true;
		setStatus(simulatorMode === "replay" ? "Replay complete" : "Simulation complete");
		environmentRetryAt = Infinity;
		movementPollRetryAt = Infinity;
	}

	function scheduleEnvironmentRetry() {
		environmentRetryAt = Date.now() + retryDelay(environmentRetryAttempts);
		environmentRetryAttempts = Math.min(environmentRetryAttempts + 1, retryAttemptLimit);
	}

	function scheduleMovementPollRetry() {
		movementPollRetryAt = Date.now() + retryDelay(movementPollRetryAttempts);
		movementPollRetryAttempts = Math.min(movementPollRetryAttempts + 1, retryAttemptLimit);
	}

	function requestResync() {
		if (resyncInProgress) return;
		resyncInProgress = true;
		stopSimulator();
		window.location.reload();
	}

	function failToStartSimulator() {
		setText("game-time-content", "Unable to start simulator.");
		requestResync();
	}

	function isReadyMovement(movement, expectedStep) {
		if (!isExecutableStep(expectedStep)) return false;
		if (!movement || typeof movement !== "object" || Array.isArray(movement)) return false;
		if (movement["<step>"] !== expectedStep) return false;
		if (!movement.meta || typeof movement.meta !== "object" || Array.isArray(movement.meta)) return false;
		if (!("curr_time" in movement.meta)) return false;
		if (typeof movement.meta.curr_time !== "string" || !movement.meta.curr_time.trim()) return false;
		if (!movement.persona || typeof movement.persona !== "object" || Array.isArray(movement.persona)) return false;

		for (let i = 0; i < Object.keys(personas).length; i++) {
			let personaName = Object.keys(personas)[i];
			let personaMovement = movement.persona[personaName];
			if (!personaMovement || typeof personaMovement !== "object" || Array.isArray(personaMovement)) return false;
			if (!Array.isArray(personaMovement.movement) || personaMovement.movement.length !== 2) return false;
			if (!Number.isFinite(personaMovement.movement[0]) || !Number.isFinite(personaMovement.movement[1])) return false;
			if (!personaMovement.movement.every(value => Number.isSafeInteger(value) && value >= 0)) return false;
			if (mapBounds && (personaMovement.movement[0] * tile_width >= mapBounds.width || personaMovement.movement[1] * tile_width >= mapBounds.height)) return false;
			if (typeof personaMovement.pronunciatio !== "string" || typeof personaMovement.description !== "string") return false;
			if (personaMovement.chat !== null && (!Array.isArray(personaMovement.chat) || !personaMovement.chat.every((entry) => Array.isArray(entry) && entry.length >= 2))) return false;
		}

		return true;
	}

	async function postEnvironment(data, postedStep) {
		if (simulatorMode !== "simulate") return;
		if (resyncInProgress) return;
		if (phase === "complete" || !isExecutableStep(postedStep)) return;
		environmentPostInFlight = true;
		setStatus("Publishing positions for step " + postedStep);
		try {
			let response = await fetch(processEnvironmentUrl, {
				signal: AbortSignal.timeout(30000),
				method: "POST",
				headers: {
					"Content-Type": "application/json",
					"X-CSRFToken": csrftoken
				},
				credentials: "same-origin",
				body: JSON.stringify(data)
			});
			if (sessionUnavailable(response)) return;
			if (response.status === 409) {
				requestResync();
				return;
			}
			if (response.status === 503) {
				setStatus("Backend unavailable · retrying positions");
				scheduleEnvironmentRetry();
				return;
			}
			if (!response.ok) {
				setStatus("Position request failed (HTTP " + response.status + ") · retrying");
				scheduleEnvironmentRetry();
				return;
			}
			if (phase === "process" && step === postedStep) {
				environmentRetryAt = 0;
				environmentRetryAttempts = 0;
				movementPollRetryAt = 0;
				movementPollRetryAttempts = 0;
				phase = "update";
				waitingSince = Date.now();
				setStatus("Waiting for backend planning · step " + step);
			}
		} catch {
			setStatus("Connection interrupted · retrying positions");
			scheduleEnvironmentRetry();
		} finally {
			environmentPostInFlight = false;
		}
	}

	async function pollMovement(pollStep) {
		if (resyncInProgress) return;
		if (phase === "complete" || !isExecutableStep(pollStep)) return;
		movementPollInFlight = true;
		try {
			let response = await fetch(movementUpdateUrl, {
				signal: AbortSignal.timeout(30000),
				method: "POST",
				headers: {
					"Content-Type": "application/json",
					"X-CSRFToken": csrftoken
				},
				credentials: "same-origin",
				body: JSON.stringify({"step": pollStep, "sim_code": sim_code})
			});
			if (sessionUnavailable(response)) return;
			if (response.status === 409 && simulatorMode === "simulate") {
				let resync;
				try {
					resync = await response.json();
				} catch {
					resync = null;
				}
				if (resync && typeof resync === "object" && !Array.isArray(resync) && resync.status === "resync") {
					requestResync();
					return;
				}
				if (phase === "update" && step === pollStep) scheduleMovementPollRetry();
				return;
			}
			if (response.status === 503) {
				setStatus("Backend unavailable · retrying movement");
				if (phase === "update" && step === pollStep) scheduleMovementPollRetry();
				return;
			}
			if (response.status === 202) {
				setStatus("Waiting for " + (simulatorMode === "replay" ? "recorded movement" : "backend planning") + " · step " + step + " · " + Math.floor((Date.now() - waitingSince) / 1000) + "s elapsed");
				scheduleMovementPollRetry();
				return;
			}
			let movement;
			try {
				movement = await response.json();
			} catch {
				if (phase === "update" && step === pollStep) scheduleMovementPollRetry();
				return;
			}

			if (simulatorMode === "replay" && movement && movement.status === "complete") {
				stopSimulator();
				return;
			}
			if (!response.ok) {
				setStatus("Movement request failed (HTTP " + response.status + ") · retrying");
				if (phase === "update" && step === pollStep) scheduleMovementPollRetry();
				return;
			}
			if (phase !== "update" || step !== pollStep) return;
			if (!isReadyMovement(movement, pollStep)) {
				setStatus("Movement data incomplete · retrying step " + step);
				scheduleMovementPollRetry();
				return;
			}
			execute_movement = movement;
			motionElapsed = 0;
			motionStarted = false;
			setStatus("Playing step " + step);
			movementPollRetryAt = 0;
			movementPollRetryAttempts = 0;
			phase = "execute";
		} catch {
			setStatus("Connection interrupted · retrying movement");
			if (phase === "update" && step === pollStep) scheduleMovementPollRetry();
		} finally {
			movementPollInFlight = false;
		}
	}

	// ###########################################################################
	// ENGINE
	// ###########################################################################

	// Joon: Phaser 3.0 is oriented around "scenes" -- recall how Pokemon plays: 
	//       there is the outdoor space, and then there is the indoor space; when
	//       you go inside, you transition to a new "scene" and the outdoor space
	//       basically disappears. 
	//       A scene in Phaser has four key methods that are called at different
	//       stages of rendering for different purposes. They are: 
	//       init() -> preload() -> create() -> update()
	//         init() is called only once at the very beginning. This is the 
	//           initialization function in case that is needed. 
	//         preload() is called once and preloads any of the assets
	//         create() is also called once after preloading... creates sprites 
	//           and actually displays stuff
	//         update() is called on each frame during the game play 

	function preload() {  
	  this.load.on("loaderror", () => setStatus("Map asset unavailable · check static file serving and reload"));
	  // Loading the necessary images (e.g., the background image, character 
	  // sprites). 

	  // Joon: for load.image, the first parameter is simply the key value that
	  //       you are passing in. The second parameter should be pointed to the
	  //       png file that contains the tileset. 
	  //       Also IMPORTANT: when you create a tileset in Tiled, always be  
	  //       sure to check the "embedded" option. 
	  this.load.image("blocks_1", "{% static 'assets/the_ville/visuals/map_assets/blocks/blocks_1.png' %}");
	  this.load.image("walls", "{% static 'assets/the_ville/visuals/map_assets/v1/Room_Builder_32x32.png' %}");
	  this.load.image("interiors_pt1", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt1.png' %}");
	  this.load.image("interiors_pt2", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt2.png' %}");
	  this.load.image("interiors_pt3", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt3.png' %}");
	  this.load.image("interiors_pt4", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt4.png' %}");
	  this.load.image("interiors_pt5", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt5.png' %}");
	  this.load.image("CuteRPG_Field_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Field_B.png' %}");
	  this.load.image("CuteRPG_Field_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Field_C.png' %}");
	  this.load.image("CuteRPG_Harbor_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Harbor_C.png' %}");
	  this.load.image("CuteRPG_Village_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Village_B.png' %}");
	  this.load.image("CuteRPG_Forest_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Forest_B.png' %}");
	  this.load.image("CuteRPG_Desert_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Desert_C.png' %}");
	  this.load.image("CuteRPG_Mountains_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Mountains_B.png' %}");
	  this.load.image("CuteRPG_Desert_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Desert_B.png' %}");
	  this.load.image("CuteRPG_Forest_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Forest_C.png' %}");

	  // Joon: This is the export json file you get from Tiled. 
	  this.load.tilemapTiledJSON("map", "{% static 'assets/the_ville/visuals/the_ville_jan7.json' %}");

	  // An atlas is a way to pack multiple images together into one texture. I'm 
	  // using it to load all the player animations (walking left, walking right, 
	  // etc.) in one image. For more info see:
	  // https://labs.phaser.io/view.html?src=src/animation/texture%20atlas%20animation.js
	  // If you don't use an atlas, you can do the same thing with a spritesheet, 
	  // see: https://labs.phaser.io/view.html?src=src/animation/single%20sprite%20sheet.js
	  // Joon: Technically, I think this guy had the best tutorial for atlas: 
	  //       https://www.youtube.com/watch?v=fdXcD9X4NrQ&ab_channel=MorganPage
	  this.load.atlas("atlas", "{% static 'assets/characters/Yuriko_Yamamoto.png' %}", "{% static 'assets/characters/atlas.json' %}");
	  const characterRoot = "{% static 'assets/characters/' %}";
	  for (const name of Object.keys(persona_names)) {
		  this.load.atlas(name, characterRoot + encodeURIComponent(name.replace(/ /g, "_")) + ".png", characterRoot + "atlas.json");
	  }

	}

	function create() {  
	  const map = this.make.tilemap({ key: "map" });
	  // Joon: Logging map is really helpful for debugging here: 
	  //       console.log(map);

	  // The first parameter is the name you gave to the tileset in Tiled and then
	  // the key of the tileset image in Phaser's cache (i.e. the name you used in
	  // preload)
	  // Joon: for the first parameter here, really take a look at the 
	  //       console.log(map) output. You need to make sure that the name 
	  //       matches.
	  const collisions = map.addTilesetImage("blocks", "blocks_1");
	  const walls = map.addTilesetImage("Room_Builder_32x32", "walls");
	  const interiors_pt1 = map.addTilesetImage("interiors_pt1", "interiors_pt1");
	  const interiors_pt2 = map.addTilesetImage("interiors_pt2", "interiors_pt2");
	  const interiors_pt3 = map.addTilesetImage("interiors_pt3", "interiors_pt3");
	  const interiors_pt4 = map.addTilesetImage("interiors_pt4", "interiors_pt4");
	  const interiors_pt5 = map.addTilesetImage("interiors_pt5", "interiors_pt5");
	  const CuteRPG_Field_B = map.addTilesetImage("CuteRPG_Field_B", "CuteRPG_Field_B");
	  const CuteRPG_Field_C = map.addTilesetImage("CuteRPG_Field_C", "CuteRPG_Field_C");
	  const CuteRPG_Harbor_C = map.addTilesetImage("CuteRPG_Harbor_C", "CuteRPG_Harbor_C");
	  const CuteRPG_Village_B = map.addTilesetImage("CuteRPG_Village_B", "CuteRPG_Village_B");
	  const CuteRPG_Forest_B = map.addTilesetImage("CuteRPG_Forest_B", "CuteRPG_Forest_B");
	  const CuteRPG_Desert_C = map.addTilesetImage("CuteRPG_Desert_C", "CuteRPG_Desert_C");
	  const CuteRPG_Mountains_B = map.addTilesetImage("CuteRPG_Mountains_B", "CuteRPG_Mountains_B");
	  const CuteRPG_Desert_B = map.addTilesetImage("CuteRPG_Desert_B", "CuteRPG_Desert_B");
	  const CuteRPG_Forest_C = map.addTilesetImage("CuteRPG_Forest_C", "CuteRPG_Forest_C");

	  // The first parameter is the layer name (or index) taken from Tiled, the 
	  // second parameter is the tileset you set above, and the final two 
	  // parameters are the x, y coordinate. 
	  // Joon: The "layer name" that comes as the first parameter value  
	  //       literally is taken from our Tiled layer name. So to find out what
	  //       they are; you actually need to open up tiled and see how you 
	  //       named things there. 
	  let tileset_group_1 = [CuteRPG_Field_B, CuteRPG_Field_C, CuteRPG_Harbor_C, CuteRPG_Village_B, 
	  											 CuteRPG_Forest_B, CuteRPG_Desert_C, CuteRPG_Mountains_B, CuteRPG_Desert_B, CuteRPG_Forest_C,
	  											 interiors_pt1, interiors_pt2, interiors_pt3, interiors_pt4, interiors_pt5, walls];
	  const bottomGroundLayer = map.createLayer("Bottom Ground", tileset_group_1, 0, 0);
	  const exteriorGroundLayer = map.createLayer("Exterior Ground", tileset_group_1, 0, 0);
	  const exteriorDecorationL1Layer = map.createLayer("Exterior Decoration L1", tileset_group_1, 0, 0);
	  const exteriorDecorationL2Layer = map.createLayer("Exterior Decoration L2", tileset_group_1, 0, 0);
	  const interiorGroundLayer = map.createLayer("Interior Ground", tileset_group_1, 0, 0);
	  const wallLayer = map.createLayer("Wall", [CuteRPG_Field_C, walls], 0, 0);
	  const interiorFurnitureL1Layer = map.createLayer("Interior Furniture L1", tileset_group_1, 0, 0);
	  const interiorFurnitureL2Layer = map.createLayer("Interior Furniture L2 ", tileset_group_1, 0, 0);
	  const foregroundL1Layer = map.createLayer("Foreground L1", tileset_group_1, 0, 0);
	  const foregroundL2Layer = map.createLayer("Foreground L2", tileset_group_1, 0, 0);
	  foregroundL1Layer.setDepth(2);
	  foregroundL2Layer.setDepth(2);

	  const collisionsLayer = map.createLayer("Collisions", collisions, 0, 0);
	  // const groundLayer = map.createLayer("Ground", walls, 0, 0);
	  // const indoorGroundLayer = map.createLayer("Indoor Ground", walls, 0, 0);
	  // const wallsLayer = map.createLayer("Walls", walls, 0, 0);
	  // const interiorsLayer = map.createLayer("Furnitures", interiors, 0, 0);
	  // const builtInLayer = map.createLayer("Built-ins", interiors, 0, 0);
	  // const appliancesLayer = map.createLayer("Appliances", interiors, 0, 0);
	  // const foregroundLayer = map.createLayer("Foreground", interiors, 0, 0);

	  // Joon : This is where you want to create a custom field for the tileset
	  //        in Tiled. Take a look at this guy's tutorial: 
	  //        https://www.youtube.com/watch?v=MR2CvWxOEsw&ab_channel=MattWilber
	  collisionsLayer.setCollisionByProperty({ collide: true });
	  // By default, everything gets depth sorted on the screen in the order we 
	  // created things. Here, we want the "Above Player" layer to sit on top of 
	  // the player, so we explicitly give it a depth. Higher depths will sit on 
	  // top of lower depth objects.
	  // Collisions layer should get a negative depth since we do not want to see
	  // it. 
	  collisionsLayer.setDepth(-1);
	  // foregroundL1Layer.setDepth(2);
	  // foregroundL1Layer.setDepth(2);

	  mapScene = this;
	  mapBounds = { width: map.widthInPixels, height: map.heightInPixels };
	  const camera = this.cameras.main;
	  camera.setBackgroundColor("#d7e5be");
	  camera.setBounds(0, 0, map.widthInPixels, map.heightInPixels);
	  cursors = this.input.keyboard.createCursorKeys();
	  let dragStart = null;
	  this.input.on("pointerdown", pointer => {
		camera.stopFollow();
		followedPersona = null;
		updateFollowButtons();
		dragStart = {x:pointer.x, y:pointer.y, scrollX:camera.scrollX, scrollY:camera.scrollY};
		setText("camera-status", "Exploring town");
	  });
	  this.input.on("pointermove", pointer => {
		if (!pointer.isDown || !dragStart) return;
		camera.setScroll(dragStart.scrollX - (pointer.x - dragStart.x) / camera.zoom, dragStart.scrollY - (pointer.y - dragStart.y) / camera.zoom);
	  });
	  for (const [name, tile] of Object.entries(spawn_tile_loc)) {
		  const texture = this.textures.exists(name) ? name : "atlas";
		  const sprite = this.add.sprite(tile[0] * tile_width + 16, tile[1] * tile_width + 32, texture, "down").setOrigin(0.5, 1).setDepth(1);
		  personas[name] = sprite;
		  pronunciatios[name] = this.add.text(sprite.x, sprite.y - 54, name.split(" ").map(part => part[0]).join(""), {
			  font: "12px sans-serif", fill: "#163c32", backgroundColor: "#ffffff", padding: {x: 5, y: 3}
		  }).setOrigin(0.5, 1).setDepth(3);
		  for (const direction of ["left", "right", "up", "down"]) {
			  this.anims.create({key: name + "-" + direction, frames: this.anims.generateFrameNames(texture, {prefix: direction + "-walk.", start: 0, end: 3, zeroPad: 3}), frameRate: 8, repeat: -1});
		  }
		  const id = name.replace(/ /g, "_");
		  setText("position__" + id, tile.join(", "));
		  const button = document.getElementById("focus__" + id);
		  if (button) button.onclick = () => focusPersona(name);
	  }
	  document.getElementById("fit-map").onclick = fitMap;
	  document.getElementById("zoom-in").onclick = () => zoomMap(1.25);
	  document.getElementById("zoom-out").onclick = () => zoomMap(0.8);
	  play_button.onclick = () => { paused = false; setStatus(statusMessage.replace("Paused · ", "")); };
	  pause_button.onclick = () => { paused = true; setStatus("Paused · step " + step); };
	  fitMap();
	  setStatus(simulatorMode === "replay" ? "Loading recorded movement" : "Waiting for backend planning · step " + step);
	}


	function update(time, delta) {

	  if (!initialStepIsValid) {
	    failToStartSimulator();
	    return;
	  }
	  if (step === terminalStep) {
	    stopSimulator();
	    return;
	  }
	  if (!isExecutableStep(step)) {
	    requestResync();
	    return;
	  }
	  if (resyncInProgress) return;
	  if (simulatorMode === "simulate" && !statusPollInFlight && Date.now() >= statusPollAt && document.getElementById("provider-progress")) void pollRuntimeStatus();
	  const camera_speed = 400 * Math.min(delta || 0, 100) / 1000;
	  if (mapScene && (cursors.left.isDown || cursors.right.isDown || cursors.up.isDown || cursors.down.isDown)) {
		const camera = mapScene.cameras.main;
		if (followedPersona) {
			camera.stopFollow();
			followedPersona = null;
			updateFollowButtons();
		}
		camera.scrollX += ((cursors.right.isDown ? 1 : 0) - (cursors.left.isDown ? 1 : 0)) * camera_speed / camera.zoom;
		camera.scrollY += ((cursors.down.isDown ? 1 : 0) - (cursors.up.isDown ? 1 : 0)) * camera_speed / camera.zoom;
		setText("camera-status", "Exploring town");
	  }
	  if (phase === "complete" || paused) return;

	  // console.log("phase: " + phase + ", step: " + step);
	  // *** MOVE PERSONAS ***
	  // Moving personas take place in three distinct phases: "process," "update,"
	  // and "execute." These phases are determined by the value of <phase>. 
	  // Only one of the three phases is incurred in each update cycle. 
	  if (phase == "process" && simulatorMode === "simulate") {
	    // "process" takes all current locations of the personas and send them to
	    // the frontend server in a json form. Here, we first create the json 
	    // file that records all persona locations: 
	    let data = {"step": step, 
	    						"sim_code": sim_code,
	                "environment": {}}
	    for (let i=0; i<Object.keys(personas).length; i++) {
	      let persona_name = Object.keys(personas)[i];
	      data["environment"][persona_name] = {"maze": curr_maze,
	                                           "x": logicalPositions[persona_name][0],
	                                           "y": logicalPositions[persona_name][1]}
	    }
	    if (!environmentPostInFlight && Date.now() >= environmentRetryAt) {
	      void postEnvironment(data, step);
	    }
	  } 

	  else if (phase == "update") { 
	    // Update is where we * wait * for the backend server to finish 
	    // computing about what the personas will do next given their current 
	    // situation. 
	    // We do this by continuously asking the backend server if it is ready. 
	    // The backend server is ready when it returns a json that has a key-val
	    // pair with "<move>": true.
	    if (!replayComplete && !movementPollInFlight && Date.now() >= movementPollRetryAt) {
	      void pollMovement(step);
	    }
	  } 

	  else if (phase === "execute") {
		if (!motionStarted) {
			movement_start = {};
			for (const [name, sprite] of Object.entries(personas)) {
				const record = execute_movement.persona[name];
				movement_start[name] = [sprite.x, sprite.y];
				movement_target[name] = [record.movement[0] * tile_width + 16, record.movement[1] * tile_width + 32];
				const id = name.replace(/ /g, "_");
				const [action, ...address] = record.description.split("@");
				setText("current_action__" + id, action.trim() || "No activity reported for this step");
				setText("target_address__" + id, formatDestination(address.join("@").trim()));
				renderChat("chat__" + id, record.chat);
				pronunciatios[name].setText(name.split(" ").map(part => part[0]).join("") + " " + record.pronunciatio);
			}
			setText("game-time-content", execute_movement.meta.curr_time);
			motionStarted = true;
		}
		const reducedMotion = typeof window.matchMedia === "function" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
		motionElapsed += Math.min(Math.max(delta || 0, 0), 100);
		const progress = reducedMotion ? 1 : Math.min(motionElapsed / movementDuration, 1);
		for (const [name, sprite] of Object.entries(personas)) {
			const [fromX, fromY] = movement_start[name];
			const [toX, toY] = movement_target[name];
			sprite.setPosition(fromX + (toX - fromX) * progress, fromY + (toY - fromY) * progress);
			const direction = toX > fromX ? "right" : toX < fromX ? "left" : toY > fromY ? "down" : toY < fromY ? "up" : null;
			if (direction && progress < 1) sprite.anims.play(name + "-" + direction, true);
			else {
				sprite.anims.stop();
				if (direction) sprite.setFrame(direction);
			}
			pronunciatios[name].setPosition(sprite.x, sprite.y - 54);
		}
		if (progress === 1) {
			for (const name of Object.keys(personas)) {
				logicalPositions[name] = [...execute_movement.persona[name].movement];
				setText("position__" + name.replace(/ /g, "_"), logicalPositions[name].join(", "));
			}
			if (step === lastExecutableStep) {
				step = terminalStep;
				stopSimulator();
			} else {
				phase = simulatorMode === "replay" ? "update" : "process";
				step += 1;
				waitingSince = Date.now();
				setStatus("Step " + (step - 1) + " complete · waiting for step " + step);
			}
		}
	  }
	}

	// Control button binders
	var play_button=document.getElementById("play_button");
	var pause_button=document.getElementById("pause_button");
</script>
